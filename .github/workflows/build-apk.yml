name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ZappyFun APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web App & 75+ MB Offline Media Pack
        run: |
          node scripts/generate-offline-pack.js
          PACK_BYTES=$(stat -c%s public/assets/media/offline-media-pack.dat)
          echo "Offline media pack size: $PACK_BYTES bytes"
          if [ "$PACK_BYTES" -lt 78643200 ]; then
            echo "ERROR: Offline media pack is smaller than 75 MiB ($PACK_BYTES bytes)"
            exit 1
          fi
          npm run build

      - name: Sync Capacitor Android & Verify Bundled Assets
        run: |
          npx cap sync android
          SYNCED_BYTES=$(stat -c%s android/app/src/main/assets/public/assets/media/offline-media-pack.dat)
          echo "Synced Android asset pack size: $SYNCED_BYTES bytes"
          if [ "$SYNCED_BYTES" -lt 78643200 ]; then
            echo "ERROR: Synced Android asset pack is smaller than 75 MiB ($SYNCED_BYTES bytes)"
            exit 1
          fi

      - name: Make Gradle executable & normalize line endings
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew

      - name: Accept Android SDK Licenses
        run: |
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin
          yes | sdkmanager --licenses 2>/dev/null || true

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK & Enforce >= 75 MB Integrity Check
        run: |
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SOURCE" ]; then
            APK_SOURCE=$(find android/app/build/outputs/apk/ -name "*-debug.apk" -type f | head -n 1)
          fi
          if [ -z "$APK_SOURCE" ] || [ ! -f "$APK_SOURCE" ]; then
            echo "ERROR: Built APK file not found!"
            exit 1
          fi
          cp -vf "$APK_SOURCE" zappyfun.apk
          sync
          chmod 644 zappyfun.apk

          # Verify non-zero and >= 75 MiB (78,643,200 bytes)
          APK_BYTES=$(stat -c%s zappyfun.apk)
          APK_MIB=$(awk "BEGIN {printf \"%.2f\", $APK_BYTES / (1024*1024)}")
          APK_MB=$(awk "BEGIN {printf \"%.2f\", $APK_BYTES / 1000000}")
          echo "Final staged zappyfun.apk: $APK_BYTES bytes ($APK_MIB MiB / $APK_MB MB)"

          if [ "$APK_BYTES" -lt 78643200 ]; then
            echo "ERROR: APK is smaller than 75 MiB ($APK_BYTES bytes)!"
            exit 1
          fi

          # Verify APK internal archive integrity
          unzip -t zappyfun.apk >/dev/null
          echo "APK ZIP/AAPT2 integrity check passed 100%!"

          echo "### 🚀 ZappyFun Android APK Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Package ID:** \`com.zappyfun.app\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Verified APK Size:** **\`${APK_MIB} MiB (${APK_MB} MB / ${APK_BYTES} bytes)\`**" >> $GITHUB_STEP_SUMMARY
          echo "- **Direct APK Download (No ZIP file!):** [**👉 Click Here to Download \`zappyfun.apk\` Directly**](https://github.com/${{ github.repository }}/releases/download/latest-apk/zappyfun.apk)" >> $GITHUB_STEP_SUMMARY

      - name: Publish Raw APK Directly to GitHub Releases (No ZIP)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-apk --yes --cleanup-tag 2>/dev/null || true
          gh release create latest-apk zappyfun.apk \
            --title "ZappyFun Official Android APK (75+ MB Direct Download)" \
            --notes "Tap **zappyfun.apk** under Assets below to download the raw 75+ MB APK file directly to your phone without any .zip file." \
            --latest || true

      - name: Upload APK Artifact (Uncompressed Store Mode)
        uses: actions/upload-artifact@v4
        with:
          name: zappyfun-apk
          path: zappyfun.apk
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
